version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "AgentHits-Dev"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major bumps are done by hand, one PR each, after a check on dev.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Held back on purpose: these break typecheck, change API behavior or need migrations.
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@better-auth/*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "stripe"
      - dependency-name: "@stepperize/react"
      - dependency-name: "@dokploy/trpc-openapi"
      - dependency-name: "ssh2"
