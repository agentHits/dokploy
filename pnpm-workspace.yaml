packages:
  - "apps/api"
  - "apps/dokploy"
  - "apps/schedules"
  - "packages/server"

minimumReleaseAge: 0

overrides:
  "@codemirror/state": "6.7.1"
  "@prisma/config>effect": "3.21.4"
  "@prisma/dev>@hono/node-server": "1.19.14"
  better-auth: "1.6.23"
  drizzle-orm: "0.45.2"
  esbuild: "0.28.1"
  h3: "1.15.11"
  hono: "4.12.28"
  js-yaml: "4.2.0"
  lodash: "4.18.1"
  postcss: "8.5.16"
  vite: "8.1.3"

peerDependencyRules:
  ignoreMissing:
    - prisma
    - "@prisma/client"
    - "@prisma/engines"
    - "@electric-sql/pglite"
    - typescript
    - drizzle-kit

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  "@tree-sitter-grammars/tree-sitter-yaml": true
  bcrypt: true
  better-sqlite3: true
  core-js-pure: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter: true
  tree-sitter-json: true
